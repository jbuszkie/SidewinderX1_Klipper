#######################################################
# Fulament Magnet Keepout Zones — Artillery X1
# Bed: 300x300mm, 36 magnets (coordinates are centers)
#
# Layout:
#   Perimeter: 6/side at [20,72,124,176,228,280], 10mm from bed edge
#   Centerlines: 4/axis at [38,113,188,263] on X=150 & Y=150
#   Rotated: dx=-59 dy=-67 from center, 90° symmetric
#
# Keepout radius: 8mm per magnet
#######################################################

# =====================================================
# BED MESH with faulty regions
# =====================================================
# Add these faulty_region entries to your existing
# [bed_mesh] section, or use this as a starting point.
# Adjust probe_count, mesh_min/max, speed to taste.
# =====================================================

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 20, 20
mesh_max: 280, 280
probe_count: 7, 7
algorithm: bicubic
# Perimeter — back edge (Y=290)
faulty_region_1_min: 12, 282
faulty_region_1_max: 28, 298
faulty_region_2_min: 64, 282
faulty_region_2_max: 80, 298
faulty_region_3_min: 116, 282
faulty_region_3_max: 132, 298
faulty_region_4_min: 168, 282
faulty_region_4_max: 184, 298
faulty_region_5_min: 220, 282
faulty_region_5_max: 236, 298
faulty_region_6_min: 272, 282
faulty_region_6_max: 288, 298
# Perimeter — front edge (Y=10)
faulty_region_7_min: 12, 2
faulty_region_7_max: 28, 18
faulty_region_8_min: 64, 2
faulty_region_8_max: 80, 18
faulty_region_9_min: 116, 2
faulty_region_9_max: 132, 18
faulty_region_10_min: 168, 2
faulty_region_10_max: 184, 18
faulty_region_11_min: 220, 2
faulty_region_11_max: 236, 18
faulty_region_12_min: 272, 2
faulty_region_12_max: 288, 18
# Perimeter — left edge (X=10)
faulty_region_13_min: 2, 12
faulty_region_13_max: 18, 28
faulty_region_14_min: 2, 64
faulty_region_14_max: 18, 80
faulty_region_15_min: 2, 116
faulty_region_15_max: 18, 132
faulty_region_16_min: 2, 168
faulty_region_16_max: 18, 184
faulty_region_17_min: 2, 220
faulty_region_17_max: 18, 236
faulty_region_18_min: 2, 272
faulty_region_18_max: 18, 288
# Perimeter — right edge (X=290)
faulty_region_19_min: 282, 12
faulty_region_19_max: 298, 28
faulty_region_20_min: 282, 64
faulty_region_20_max: 298, 80
faulty_region_21_min: 282, 116
faulty_region_21_max: 298, 132
faulty_region_22_min: 282, 168
faulty_region_22_max: 298, 184
faulty_region_23_min: 282, 220
faulty_region_23_max: 298, 236
faulty_region_24_min: 282, 272
faulty_region_24_max: 298, 288
# Centerline — vertical (X=150)
faulty_region_25_min: 142, 30
faulty_region_25_max: 158, 46
faulty_region_26_min: 142, 105
faulty_region_26_max: 158, 121
faulty_region_27_min: 142, 180
faulty_region_27_max: 158, 196
faulty_region_28_min: 142, 255
faulty_region_28_max: 158, 271
# Centerline — horizontal (Y=150)
faulty_region_29_min: 30, 142
faulty_region_29_max: 46, 158
faulty_region_30_min: 105, 142
faulty_region_30_max: 121, 158
faulty_region_31_min: 180, 142
faulty_region_31_max: 196, 158
faulty_region_32_min: 255, 142
faulty_region_32_max: 271, 158
# Rotated group (dx=-59, dy=-67 from center 150,150)
faulty_region_33_min: 83, 75
faulty_region_33_max: 99, 91
faulty_region_34_min: 75, 201
faulty_region_34_max: 91, 217
faulty_region_35_min: 201, 209
faulty_region_35_max: 217, 225
faulty_region_36_min: 209, 83
faulty_region_36_max: 225, 99


#######################################################
# VERIFICATION MACROS
#######################################################
# Two ways to verify magnet locations:
#
# 1. MAGNET_SCAN — Dense 30x30 grid scan of the full bed.
#    Best run WITHOUT the steel sheet so the probe reads
#    aluminum vs neodymium directly. View the resulting
#    mesh in Mainsail/Fluidd's heightmap visualizer —
#    magnets show up as clear peaks or valleys.
#
# 2. MAGNET_VERIFY — Probes each predicted magnet center
#    plus an offset point 15mm away. Compares Z values
#    and flags any magnet where the difference is below
#    threshold (meaning we may have the wrong spot).
#    Works with or without the steel sheet.
#######################################################

[gcode_macro MAGNET_SCAN]
description: Dense 30x30 bed scan to map magnet locations. Best without steel sheet. Homes X/Y only — will NOT home Z.
gcode:
    {% set SPEED = params.SPEED|default(120)|int %}
    {% set Z_HOP = params.Z_HOP|default(5)|float %}
    {% set Z_START = params.Z_START|default(15)|float %}

    # Home X/Y only — DO NOT home Z without the steel sheet!
    G28 X Y

    M118 -----------------------------------------------
    M118 MAGNET SCAN — safe Z setup
    M118 -----------------------------------------------
    M118 Z is NOT homed. Manually jog Z down now until
    M118 the nozzle is ~{Z_START}mm above the bare bed.
    M118 Then run MAGNET_SCAN_GO to start the probe grid.
    M118 -----------------------------------------------
    M117 Jog Z down, then run MAGNET_SCAN_GO

[gcode_macro MAGNET_SCAN_GO]
description: Call this AFTER MAGNET_SCAN and manually jogging Z to a safe height. Fakes Z home and runs the dense mesh.
gcode:
    {% set SPEED = params.SPEED|default(120)|int %}
    {% set Z_HOP = params.Z_HOP|default(5)|float %}
    {% set Z_POS = params.Z_POS|default(15)|float %}

    # Tell Klipper "Z is homed and currently at this height"
    # so BED_MESH_CALIBRATE will run. Set Z_POS to your
    # best estimate of current nozzle height above the bed.
    SET_KINEMATIC_POSITION Z={Z_POS}

    M118 Z position set to {Z_POS}mm. Starting scan...
    M117 Scanning 30x30...

    # Lift to safe travel height before moving
    G1 Z{Z_HOP + 5} F600

    BED_MESH_CLEAR
    BED_MESH_CALIBRATE PROFILE=magnet_scan mesh_min=10,10 mesh_max=290,290 probe_count=30,30 algorithm=bicubic speed={SPEED} horizontal_move_z={Z_HOP}

    # Park at center, raised up
    G1 Z{Z_HOP + 10} F600
    G1 X150 Y150 F3000
    M117 Scan complete! Check heightmap.
    M118 -----------------------------------------------
    M118 Scan complete! Open the heightmap visualizer in
    M118 Mainsail/Fluidd to see magnet locations.
    M118 Run SAVE_CONFIG to keep the profile for later.
    M118 -----------------------------------------------

[gcode_macro MAGNET_VERIFY]
description: Probe each predicted magnet center vs a nearby offset point to verify positions.
variable_results: ""
gcode:
    {% set Z_HOP = params.Z_HOP|default(5)|float %}
    {% set FEED = params.SPEED|default(3000)|int %}
    {% set OFFSET = params.OFFSET|default(15)|int %}
    {% set THRESHOLD = params.THRESHOLD|default(0.05)|float %}

    # All 36 magnet centers
    {% set magnets = [
        [20,290],[72,290],[124,290],[176,290],[228,290],[280,290],
        [20,10],[72,10],[124,10],[176,10],[228,10],[280,10],
        [10,20],[10,72],[10,124],[10,176],[10,228],[10,280],
        [290,20],[290,72],[290,124],[290,176],[290,228],[290,280],
        [150,38],[150,113],[150,188],[150,263],
        [38,150],[113,150],[188,150],[263,150],
        [91,83],[83,209],[209,217],[217,91]
    ] %}

    {% set Z_POS = params.Z_POS|default(15)|float %}

    # Home X/Y only — safe for bare bed without steel sheet
    G28 X Y
    # Fake Z home at estimated current height
    SET_KINEMATIC_POSITION Z={Z_POS}
    # Lift before moving
    G1 Z{Z_HOP + 5} F600
    M117 Verifying {magnets|length} magnet positions...

    {% for m in magnets %}
        {% set mx = m[0] %}
        {% set my = m[1] %}
        # Clamp offset point to stay on bed
        {% set ox = [[(mx + OFFSET), 295]|min, 5]|max %}
        {% set oy = my %}
        {% if ox == mx %}
            {% set ox = [[(mx - OFFSET), 295]|min, 5]|max %}
        {% endif %}

        # Probe the magnet center
        G1 Z{Z_HOP} F1000
        G1 X{mx} Y{my} F{FEED}
        PROBE
        {% set mag_z = printer.probe.last_z_offset %}

        # Probe the offset point (should be clear of magnet)
        G1 Z{Z_HOP} F1000
        G1 X{ox} Y{oy} F{FEED}
        PROBE
        {% set ref_z = printer.probe.last_z_offset %}

        {% set diff = (mag_z - ref_z)|abs %}
        {% if diff < THRESHOLD %}
            M118 WARNING: Magnet #{loop.index} at ({mx},{my}) diff={diff|round(3)}mm — may be mislocated!
        {% else %}
            M118 OK: Magnet #{loop.index} at ({mx},{my}) diff={diff|round(3)}mm
        {% endif %}
    {% endfor %}

    G1 Z{Z_HOP} F1000
    G1 X150 Y150 F{FEED}
    M117 Verification complete! Check console output.

[gcode_macro MAGNET_TOUR]
description: Homes X/Y only, then walks the probe over each magnet position. No Z home needed — set Z manually first. Use MAGNET_NEXT to advance, MAGNET_GOTO N=<num> to jump.
variable_index: 0
variable_z_height: 5
gcode:
    {% set Z = params.Z|default(5)|float %}
    SET_GCODE_VARIABLE MACRO=MAGNET_TOUR VARIABLE=z_height VALUE={Z}
    SET_GCODE_VARIABLE MACRO=MAGNET_TOUR VARIABLE=index VALUE=0

    # Home X/Y only — no Z home, no steel sheet needed
    G28 X Y
    M117 Homed X/Y. Use console to set Z height.
    M118 -----------------------------------------------
    M118 MAGNET TOUR — 36 positions
    M118 -----------------------------------------------
    M118 Step 1: Jog Z down manually until the probe
    M118         is just above the bed surface.
    M118 Step 2: Run MAGNET_NEXT to go to magnet #1.
    M118         Or MAGNET_GOTO N=<number> to jump.
    M118 Step 3: At each stop, check if the probe is
    M118         centered over the magnet. Note any
    M118         that are off.
    M118 -----------------------------------------------
    M118 Tip: MAGNET_TOUR Z=3 to change travel height.
    M118 -----------------------------------------------

[gcode_macro MAGNET_NEXT]
description: Move to the next magnet in the tour. Shows position info.
gcode:
    {% set tour = printer["gcode_macro MAGNET_TOUR"] %}
    {% set idx = tour.index|int %}
    {% set z = tour.z_height|float %}
    {% set FEED = params.SPEED|default(3000)|int %}

    {% set magnets = [
        [20,290,"Perim back #1"],
        [72,290,"Perim back #2"],
        [124,290,"Perim back #3"],
        [176,290,"Perim back #4"],
        [228,290,"Perim back #5"],
        [280,290,"Perim back #6"],
        [20,10,"Perim front #1"],
        [72,10,"Perim front #2"],
        [124,10,"Perim front #3"],
        [176,10,"Perim front #4"],
        [228,10,"Perim front #5"],
        [280,10,"Perim front #6"],
        [10,20,"Perim left #1"],
        [10,72,"Perim left #2"],
        [10,124,"Perim left #3"],
        [10,176,"Perim left #4"],
        [10,228,"Perim left #5"],
        [10,280,"Perim left #6"],
        [290,20,"Perim right #1"],
        [290,72,"Perim right #2"],
        [290,124,"Perim right #3"],
        [290,176,"Perim right #4"],
        [290,228,"Perim right #5"],
        [290,280,"Perim right #6"],
        [150,38,"Center Y #1"],
        [150,113,"Center Y #2"],
        [150,188,"Center Y #3"],
        [150,263,"Center Y #4"],
        [38,150,"Center X #1"],
        [113,150,"Center X #2"],
        [188,150,"Center X #3"],
        [263,150,"Center X #4"],
        [91,83,"Rotated #1 (seed)"],
        [83,209,"Rotated #2"],
        [209,217,"Rotated #3"],
        [217,91,"Rotated #4"]
    ] %}

    {% if idx >= magnets|length %}
        M118 Tour complete! All 36 magnets visited.
        M117 Tour complete!
        SET_GCODE_VARIABLE MACRO=MAGNET_TOUR VARIABLE=index VALUE=0
    {% else %}
        {% set m = magnets[idx] %}
        G1 Z{z} F1000
        G1 X{m[0]} Y{m[1]} F{FEED}
        M118 >>> Magnet {idx + 1}/36: {m[2]} at ({m[0]}, {m[1]})
        M117 #{idx + 1}/36: ({m[0]},{m[1]}) {m[2]}
        SET_GCODE_VARIABLE MACRO=MAGNET_TOUR VARIABLE=index VALUE={idx + 1}
    {% endif %}

[gcode_macro MAGNET_GOTO]
description: Jump to a specific magnet number in the tour. Usage: MAGNET_GOTO N=5
gcode:
    {% set N = params.N|default(1)|int %}
    {% set z = printer["gcode_macro MAGNET_TOUR"].z_height|float %}
    {% set FEED = params.SPEED|default(3000)|int %}

    {% set magnets = [
        [20,290,"Perim back #1"],
        [72,290,"Perim back #2"],
        [124,290,"Perim back #3"],
        [176,290,"Perim back #4"],
        [228,290,"Perim back #5"],
        [280,290,"Perim back #6"],
        [20,10,"Perim front #1"],
        [72,10,"Perim front #2"],
        [124,10,"Perim front #3"],
        [176,10,"Perim front #4"],
        [228,10,"Perim front #5"],
        [280,10,"Perim front #6"],
        [10,20,"Perim left #1"],
        [10,72,"Perim left #2"],
        [10,124,"Perim left #3"],
        [10,176,"Perim left #4"],
        [10,228,"Perim left #5"],
        [10,280,"Perim left #6"],
        [290,20,"Perim right #1"],
        [290,72,"Perim right #2"],
        [290,124,"Perim right #3"],
        [290,176,"Perim right #4"],
        [290,228,"Perim right #5"],
        [290,280,"Perim right #6"],
        [150,38,"Center Y #1"],
        [150,113,"Center Y #2"],
        [150,188,"Center Y #3"],
        [150,263,"Center Y #4"],
        [38,150,"Center X #1"],
        [113,150,"Center X #2"],
        [188,150,"Center X #3"],
        [263,150,"Center X #4"],
        [91,83,"Rotated #1 (seed)"],
        [83,209,"Rotated #2"],
        [209,217,"Rotated #3"],
        [217,91,"Rotated #4"]
    ] %}

    {% if N < 1 or N > magnets|length %}
        M118 Invalid magnet number. Use N=1 through N=36.
    {% else %}
        {% set m = magnets[N - 1] %}
        G1 Z{z} F1000
        G1 X{m[0]} Y{m[1]} F{FEED}
        M118 >>> Magnet {N}/36: {m[2]} at ({m[0]}, {m[1]})
        M117 #{N}/36: ({m[0]},{m[1]}) {m[2]}
        SET_GCODE_VARIABLE MACRO=MAGNET_TOUR VARIABLE=index VALUE={N}
    {% endif %}