#######################################################
# Fulament Magnet Keepout Config — Artillery X1
# Created: August 2026
#
# PURPOSE:
# The Fulament bed has 36 embedded neodymium magnets
# that hold the steel spring sheet. These magnets
# interfere with the inductive probe (AR18), causing
# it to trigger early over magnet locations. This
# file contains:
#
#   1. Faulty region definitions (commented out) to
#      paste into printer.cfg [bed_mesh] section.
#      These tell Klipper to skip probing over magnets.
#
#   2. Macros to verify and map magnet positions using
#      the probe itself.
#
# PRINTER SETUP:
#   Probe: Inductive, pin ^!ar18
#   Probe offset: X=28.0, Y=-33.0
#   Bed: 300x300mm
#   Note: position_min: -2 in [stepper_z] is needed
#   for sheet-off scanning (probe goes below Z=0)
#
# MAGNET LAYOUT (36 total):
#   Perimeter (24): 6 per side at [20,72,124,176,228,280]
#     along each edge, 10mm perpendicular offset from edge.
#     20mm from corners, 52mm spacing between magnets.
#     Corner pairs overlap so are merged in faulty regions.
#
#   Centerlines (8): 4 per axis at [38,113,188,263]
#     on X=150 (vertical) and Y=150 (horizontal).
#     75mm spacing with half-gap ends.
#
#   Rotated (4): One magnet placed and rotated 90° around
#     bed center (150,150). Offset dx=-59, dy=-67.
#     Positions: (91,83), (83,209), (209,217), (217,91)
#
# KEEPOUT RADIUS:
#   Currently 8mm. PROBE_GRID testing shows magnet
#   influence extends ~10-12mm from center. Consider
#   bumping to 10mm after verification is complete.
#######################################################

# =====================================================
# FAULTY REGIONS — paste these into your [bed_mesh]
# section in printer.cfg AFTER verifying magnet positions.
# Also update your mesh_max to 270,265 (Y=270 is too high
# with probe Y offset -33, nozzle would hit Y=303).
# =====================================================
#
# MERGED CORNERS — each covers two nearby magnets
# Back-left corner: magnets (20,290) + (10,280)
# faulty_region_1_min: 2, 272
# faulty_region_1_max: 28, 298
# Back-right corner: magnets (280,290) + (290,280)
# faulty_region_2_min: 272, 272
# faulty_region_2_max: 298, 298
# Front-left corner: magnets (20,10) + (10,20)
# faulty_region_3_min: 2, 2
# faulty_region_3_max: 28, 28
# Front-right corner: magnets (280,10) + (290,20)
# faulty_region_4_min: 272, 2
# faulty_region_4_max: 298, 28
# Perimeter — back edge (Y=290), inner 4 only
# faulty_region_5_min: 64, 282
# faulty_region_5_max: 80, 298
# faulty_region_6_min: 116, 282
# faulty_region_6_max: 132, 298
# faulty_region_7_min: 168, 282
# faulty_region_7_max: 184, 298
# faulty_region_8_min: 220, 282
# faulty_region_8_max: 236, 298
# Perimeter — front edge (Y=10), inner 4 only
# faulty_region_9_min: 64, 2
# faulty_region_9_max: 80, 18
# faulty_region_10_min: 116, 2
# faulty_region_10_max: 132, 18
# faulty_region_11_min: 168, 2
# faulty_region_11_max: 184, 18
# faulty_region_12_min: 220, 2
# faulty_region_12_max: 236, 18
# Perimeter — left edge (X=10), inner 4 only
# faulty_region_13_min: 2, 64
# faulty_region_13_max: 18, 80
# faulty_region_14_min: 2, 116
# faulty_region_14_max: 18, 132
# faulty_region_15_min: 2, 168
# faulty_region_15_max: 18, 184
# faulty_region_16_min: 2, 220
# faulty_region_16_max: 18, 236
# Perimeter — right edge (X=290), inner 4 only
# faulty_region_17_min: 282, 64
# faulty_region_17_max: 298, 80
# faulty_region_18_min: 282, 116
# faulty_region_18_max: 298, 132
# faulty_region_19_min: 282, 168
# faulty_region_19_max: 298, 184
# faulty_region_20_min: 282, 220
# faulty_region_20_max: 298, 236
# Centerline — vertical (X=150)
# faulty_region_21_min: 142, 30
# faulty_region_21_max: 158, 46
# faulty_region_22_min: 142, 105
# faulty_region_22_max: 158, 121
# faulty_region_23_min: 142, 180
# faulty_region_23_max: 158, 196
