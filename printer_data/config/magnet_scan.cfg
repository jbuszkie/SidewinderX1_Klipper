# faulty_region_32_max: 225, 99


#######################################################
# MACROS — Magnet Verification & Mapping
#######################################################
#
# These macros exist because we needed to verify that
# our estimated magnet positions (from photos) actually
# match reality. The inductive probe sees magnets as
# Z anomalies — the magnetic field makes the probe
# trigger earlier (higher Z reading) over a magnet.
#
# IMPORTANT SAFETY NOTES:
#   - The probe CANNOT sense bare aluminum from normal
#     height. It only works sheet-off because we set
#     position_min: -2 in [stepper_z], letting the
#     probe travel below Z=0 to get close enough.
#   - NEVER G28 without the steel sheet — Z homing
#     will crash the nozzle into the bare aluminum bed.
#   - All "two-step" macros (MAGNET_SCAN, MAGNET_ZOOM,
#     MAGNET_VERIFY, MAGNET_TOUR) home WITH the sheet,
#     park Z high, then tell you to remove the sheet
#     before running the _GO companion macro.
#
# ─── PROBING MACROS (measure Z at each point) ───
#
# PROBE_GRID / PROBE_GRID_NH
#   Best tool for detailed magnet analysis. Probes a
#   dense grid around a magnet center and logs raw
#   "probe at X,Y is z=Z" to console/klippy.log.
#   No mesh math — just raw Z values for plotting.
#   Use PROBE_GRID_NH (no-home) to chain multiple
#   scans after a single G28.
#   Testing showed ~400µm signal through the steel
#   sheet — raw PROBE sees 7.5x more magnet signal
#   than BED_MESH_CALIBRATE due to bicubic smoothing.
#   Usage: PROBE_GRID CX=150 CY=113 SIZE=40 COUNT=20
#          PROBE_GRID_NH CX=91 CY=83 SIZE=40 COUNT=20
#
# MAGNET_SCAN / MAGNET_SCAN_GO
#   Full-bed 30x30 scan (900 points) using Klipper's
#   BED_MESH_CALIBRATE. Good for seeing the overall
#   magnet pattern across the whole bed in Mainsail/
#   Fluidd's heightmap visualizer. Two-step: homes
#   with sheet, parks Z=50, you remove sheet, then
#   run _GO. Less detailed than PROBE_GRID due to
#   bicubic interpolation smoothing the peaks.
#   Note: Uses mesh_min=30,2 mesh_max=298,265 to
#   account for probe offset (X+28, Y-33). Your
#   printer.cfg mesh_max Y should be ≤265 too.
#   Usage: MAGNET_SCAN → remove sheet → MAGNET_SCAN_GO
#
# MAGNET_ZOOM / MAGNET_ZOOM_GO
#   Like MAGNET_SCAN but focused on a small area
#   around one magnet. Uses BED_MESH_CALIBRATE with
#   a tight mesh_min/max box. Limited to lagrange
#   max 6x6 or bicubic for larger grids. Mostly
#   superseded by PROBE_GRID which gives better data.
#   Usage: MAGNET_ZOOM X=150 Y=113 → MAGNET_ZOOM_GO
#
# MAGNET_VERIFY / MAGNET_VERIFY_GO
#   Quick check of all 36 predicted magnet positions.
#   Probes each magnet center vs a point 15mm away
#   and reports the Z difference. If diff < threshold,
#   flags that magnet as potentially mislocated.
#   Two-step with sheet removal.
#   Usage: MAGNET_VERIFY → remove sheet → MAGNET_VERIFY_GO
#
# ─── NON-PROBING MACROS (visual/binary detection) ──
#
# MAGNET_TOUR / MAGNET_NEXT / MAGNET_GOTO
#   Visual verification. Moves the probe over each
#   of the 36 predicted magnet positions so you can
#   visually check if the probe is centered over the
#   physical magnet. Two-step: homes with sheet,
#   parks high, you remove sheet and jog Z down,
#   then step through positions with MAGNET_NEXT
#   or jump to any magnet with MAGNET_GOTO N=<num>.
#   Each stop shows a label like "Back 3" or
#   "Rotated 1" on the LCD and console.
#   Usage: MAGNET_TOUR → MAGNET_NEXT (repeat)
#          MAGNET_GOTO N=33 (jump to rotated #1)
#
# MAGNET_FIND_Z
#   Helper for MAGNET_DETECT. Lowers Z in small
#   steps over a known non-magnet area, querying the
#   probe at each height. Watch the console for when
#   "probe: TRIGGERED" first appears — that's where
#   bare aluminum triggers. Set MAGNET_DETECT Z to
#   slightly above that threshold.
#   Usage: MAGNET_FIND_Z Z=1.0 STEP=0.1
#
# MAGNET_DETECT
#   Fast binary magnet mapper. Moves across the full
#   bed at a fixed Z height (no Z movement during
#   scan), querying the probe state at each XY point.
#   At the right Z height, the probe triggers ONLY
#   over magnets, giving a clean binary map. Much
#   faster than probing since there's no Z travel.
#   Parse klippy.log for "MDET x,y" + "probe: TRIGGERED"
#   pairs to find magnet locations.
#   Usage: MAGNET_DETECT Z=-0.3 STEP=3
#######################################################

[gcode_macro PROBE_GRID]
description: Raw probe grid scan. Console logs "probe at X,Y is z=Z" at each point. Usage: PROBE_GRID CX=150 CY=113 SIZE=40 COUNT=20
gcode:
    {% set CX = params.CX|default(150)|float %}
    {% set CY = params.CY|default(113)|float %}
    {% set SIZE = params.SIZE|default(40)|float %}
    {% set COUNT = params.COUNT|default(20)|int %}
    {% set SPEED = params.SPEED|default(80)|int %}
    {% set Z_HOP = params.Z_HOP|default(3)|float %}
    {% set HALF = SIZE / 2 %}
    {% set FEED = SPEED * 60 %}

    {% set x_start = CX - HALF %}
    {% set y_start = CY - HALF %}
    {% set step = SIZE / (COUNT - 1) %}

    {% set NOHOME = params.NOHOME|default(0)|int %}

    {% if NOHOME == 0 %}
    G28
    {% endif %}
    M118 PROBE_GRID_START center=({CX},{CY}) size={SIZE} count={COUNT} step={step|round(2)}
    M118 Probe offset: X=28.0 Y=-33.0
    M118 Console "probe at" lines are NOZZLE positions.
    M118 Add X+28, Y-33 for bed position.

    {% for row in range(COUNT) %}
        {% set py = y_start + row * step %}
        {% for col in range(COUNT) %}
            {% if row % 2 == 0 %}
                {% set px = x_start + col * step %}
            {% else %}
                {% set px = x_start + (COUNT - 1 - col) * step %}
            {% endif %}
            {% set pt = row * COUNT + col + 1 %}
            {% set total = COUNT * COUNT %}
            ; Move nozzle so probe lands at (px, py)
            {% set nx = px - 28.0 %}
            {% set ny = py + 33.0 %}
            G1 Z{Z_HOP} F1000
            G1 X{nx|round(2)} Y{ny|round(2)} F{FEED}
            M118 {pt}/{total}
            M117 {pt}/{total}
            PROBE SAMPLES=1
        {% endfor %}
    {% endfor %}

    G1 Z10 F1000
    G1 X150 Y150 F3000
    M118 PROBE_GRID_END
    M117 Probe grid complete!

[gcode_macro PROBE_GRID_NH]
description: PROBE_GRID without homing. Use after G28 + sheet removal. Usage: PROBE_GRID_NH CX=150 CY=113 SIZE=40 COUNT=20
gcode:
    {% set CX = params.CX|default(150)|float %}
    {% set CY = params.CY|default(113)|float %}
    {% set SIZE = params.SIZE|default(40)|float %}
    {% set COUNT = params.COUNT|default(20)|int %}
    {% set SPEED = params.SPEED|default(80)|int %}
    {% set Z_HOP = params.Z_HOP|default(3)|float %}
    {% set HALF = SIZE / 2 %}
    {% set FEED = SPEED * 60 %}
    {% set x_start = CX - HALF %}
    {% set y_start = CY - HALF %}
    {% set step = SIZE / (COUNT - 1) %}

    M118 PROBE_GRID_START center=({CX},{CY}) size={SIZE} count={COUNT} step={step|round(2)}

    {% for row in range(COUNT) %}
        {% set py = y_start + row * step %}
        {% for col in range(COUNT) %}
            {% if row % 2 == 0 %}
                {% set px = x_start + col * step %}
            {% else %}
                {% set px = x_start + (COUNT - 1 - col) * step %}
            {% endif %}
            {% set pt = row * COUNT + col + 1 %}
            {% set total = COUNT * COUNT %}
            {% set nx = px - 28.0 %}
            {% set ny = py + 33.0 %}
            G1 Z{Z_HOP} F1000
            G1 X{nx|round(2)} Y{ny|round(2)} F{FEED}
            M118 {pt}/{total}
            M117 {pt}/{total}
            PROBE SAMPLES=1
        {% endfor %}
    {% endfor %}

    G1 Z10 F1000
    G1 X150 Y150 F3000
    M118 PROBE_GRID_END
    M117 Probe grid complete!

[gcode_macro MAGNET_ZOOM]
description: Dense local scan around a magnet. Usage: MAGNET_ZOOM X=150 Y=113 SIZE=40 COUNT=20
gcode:
    {% set MX = params.X|default(150)|float %}
    {% set MY = params.Y|default(113)|float %}
    {% set SIZE = params.SIZE|default(40)|float %}
    {% set COUNT = params.COUNT|default(20)|int %}
    {% set SPEED = params.SPEED|default(80)|int %}
    {% set Z_HOP = params.Z_HOP|default(5)|float %}
    {% set Z_PARK = params.Z_PARK|default(50)|float %}
    {% set HALF = SIZE / 2 %}

    {% set x_min = [(MX - HALF), 30]|max %}
    {% set x_max = [(MX + HALF), 298]|min %}
    {% set y_min = [(MY - HALF), 2]|max %}
    {% set y_max = [(MY + HALF), 265]|min %}

    G28
    G1 Z{Z_PARK} F1000
    G1 X150 Y150 F3000

    M118 -----------------------------------------------
    M118 MAGNET ZOOM — local scan around ({MX}, {MY})
    M118 Area: ({x_min},{y_min}) to ({x_max},{y_max})
    M118 Grid: {COUNT}x{COUNT} = {COUNT * COUNT} points
    M118 -----------------------------------------------
    M118 Remove steel sheet, then run MAGNET_ZOOM_GO
    M118 with same params:
    M118 MAGNET_ZOOM_GO X={MX} Y={MY} SIZE={SIZE} COUNT={COUNT}
    M118 -----------------------------------------------
    M117 Remove sheet, then MAGNET_ZOOM_GO

[gcode_macro MAGNET_ZOOM_GO]
description: Runs the local scan after sheet removal. Use same params as MAGNET_ZOOM.
gcode:
    {% set MX = params.X|default(150)|float %}
    {% set MY = params.Y|default(113)|float %}
    {% set SIZE = params.SIZE|default(40)|float %}
    {% set COUNT = params.COUNT|default(20)|int %}
    {% set SPEED = params.SPEED|default(80)|int %}
    {% set Z_HOP = params.Z_HOP|default(3)|float %}
    {% set HALF = SIZE / 2 %}

    {% set x_min = [(MX - HALF), 30]|max %}
    {% set x_max = [(MX + HALF), 298]|min %}
    {% set y_min = [(MY - HALF), 2]|max %}
    {% set y_max = [(MY + HALF), 265]|min %}

    M118 Scanning {COUNT}x{COUNT} grid around ({MX},{MY})...
    M117 Zoom scan {COUNT}x{COUNT}...

    BED_MESH_CLEAR
    BED_MESH_CALIBRATE PROFILE=magnet_zoom mesh_min={x_min},{y_min} mesh_max={x_max},{y_max} probe_count={COUNT},{COUNT} algorithm=lagrange speed={SPEED} horizontal_move_z={Z_HOP}

    G1 Z15 F600
    G1 X150 Y150 F3000
    M117 Zoom scan complete!
    M118 -----------------------------------------------
    M118 Zoom scan complete! Check heightmap.
    M118 The dip/peak shape shows the magnet influence.
    M118 -----------------------------------------------

[gcode_macro MAGNET_SCAN]
description: Dense 30x30 bed scan. Homes with steel sheet, raises Z, pauses for sheet removal.
gcode:
    {% set SPEED = params.SPEED|default(120)|int %}
    {% set Z_HOP = params.Z_HOP|default(5)|float %}
    {% set Z_PARK = params.Z_PARK|default(50)|float %}

    # Full home WITH the steel sheet in place
    G28
    # Raise Z so you can safely remove the sheet
    G1 Z{Z_PARK} F1000
    G1 X150 Y150 F3000

    M118 -----------------------------------------------
    M118 MAGNET SCAN — remove steel sheet now
    M118 -----------------------------------------------
    M118 Z is at {Z_PARK}mm. Remove the steel sheet,
    M118 then run MAGNET_SCAN_GO to start the 30x30 scan.
    M118 -----------------------------------------------
    M117 Remove sheet, then MAGNET_SCAN_GO

[gcode_macro MAGNET_SCAN_GO]
description: Call AFTER removing the steel sheet. Runs the dense 30x30 probe grid.
gcode:
    {% set SPEED = params.SPEED|default(120)|int %}
    {% set Z_HOP = params.Z_HOP|default(5)|float %}

    M118 Starting 30x30 scan (900 points)...
    M117 Scanning 30x30...

    BED_MESH_CLEAR
    BED_MESH_CALIBRATE PROFILE=magnet_scan mesh_min=30,2 mesh_max=298,265 probe_count=30,30 algorithm=bicubic speed={SPEED} horizontal_move_z={Z_HOP}

    # Park at center, raised up
    G1 Z20 F600
    G1 X150 Y150 F3000
    M117 Scan complete! Check heightmap.
    M118 -----------------------------------------------
    M118 Scan complete! Open the heightmap visualizer in
    M118 Mainsail/Fluidd to see magnet locations.
    M118 Run SAVE_CONFIG to keep the profile for later.
    M118 -----------------------------------------------

[gcode_macro MAGNET_VERIFY]
description: Homes with steel sheet, raises Z for removal, then run MAGNET_VERIFY_GO.
gcode:
    {% set Z_PARK = params.Z_PARK|default(50)|float %}

    # Full home with steel sheet, then raise Z for removal
    G28
    G1 Z{Z_PARK} F1000
    G1 X150 Y150 F3000
    M118 Z at {Z_PARK}mm. Remove steel sheet, then run MAGNET_VERIFY_GO
    M117 Remove sheet, then MAGNET_VERIFY_GO

[gcode_macro MAGNET_VERIFY_GO]
description: Call AFTER removing steel sheet. Probes each magnet vs offset point.
gcode:
    {% set Z_HOP = params.Z_HOP|default(5)|float %}
    {% set FEED = params.SPEED|default(3000)|int %}
    {% set OFFSET = params.OFFSET|default(15)|int %}
    {% set THRESHOLD = params.THRESHOLD|default(0.05)|float %}

    {% set magnets = [
        [20,290],[72,290],[124,290],[176,290],[228,290],[280,290],
        [20,10],[72,10],[124,10],[176,10],[228,10],[280,10],
        [10,20],[10,72],[10,124],[10,176],[10,228],[10,280],
        [290,20],[290,72],[290,124],[290,176],[290,228],[290,280],
        [150,38],[150,113],[150,188],[150,263],
        [38,150],[113,150],[188,150],[263,150],
        [91,83],[83,209],[209,217],[217,91]
    ] %}

    M117 Verifying {magnets|length} magnet positions...

    {% for m in magnets %}
        {% set mx = m[0] %}
        {% set my = m[1] %}
        # Clamp offset point to stay on bed
        {% set ox = [[(mx + OFFSET), 295]|min, 5]|max %}
        {% set oy = my %}
        {% if ox == mx %}
            {% set ox = [[(mx - OFFSET), 295]|min, 5]|max %}
        {% endif %}

        # Probe the magnet center
        G1 Z{Z_HOP} F1000
        G1 X{mx} Y{my} F{FEED}
        PROBE
        {% set mag_z = printer.probe.last_z_offset %}

        # Probe the offset point (should be clear of magnet)
        G1 Z{Z_HOP} F1000
        G1 X{ox} Y{oy} F{FEED}
        PROBE
        {% set ref_z = printer.probe.last_z_offset %}

        {% set diff = (mag_z - ref_z)|abs %}
        {% if diff < THRESHOLD %}
            M118 WARNING: Magnet #{loop.index} at ({mx},{my}) diff={diff|round(3)}mm — may be mislocated!
        {% else %}
            M118 OK: Magnet #{loop.index} at ({mx},{my}) diff={diff|round(3)}mm
        {% endif %}
    {% endfor %}

    G1 Z{Z_HOP} F1000
    G1 X150 Y150 F{FEED}
    M117 Verification complete! Check console output.

[gcode_macro MAGNET_TOUR]
description: Homes all axes with steel sheet, raises Z for sheet removal, then walk magnets with MAGNET_NEXT.
variable_index: 0
variable_z_height: 5
gcode:
    {% set Z = params.Z|default(5)|float %}
    {% set Z_PARK = params.Z_PARK|default(50)|float %}
    SET_GCODE_VARIABLE MACRO=MAGNET_TOUR VARIABLE=z_height VALUE={Z}
    SET_GCODE_VARIABLE MACRO=MAGNET_TOUR VARIABLE=index VALUE=0

    # Full home with steel sheet in place
    G28
    # Raise Z so you can remove the sheet
    G1 Z{Z_PARK} F1000
    G1 X150 Y150 F3000

    M118 -----------------------------------------------
    M118 MAGNET TOUR — 36 positions
    M118 -----------------------------------------------
    M118 Z is at {Z_PARK}mm. Remove the steel sheet.
    M118 Then jog Z down to just above the bare bed.
    M118 Run MAGNET_NEXT or MAGNET_GOTO N=<num>.
    M118 -----------------------------------------------
    M118 Tip: MAGNET_TOUR Z=3 to change travel height.
    M118 -----------------------------------------------

[gcode_macro MAGNET_NEXT]
description: Move to the next magnet in the tour. Shows position info.
gcode:
    {% set tour = printer["gcode_macro MAGNET_TOUR"] %}
    {% set idx = tour.index|int %}
    {% set z = tour.z_height|float %}
    {% set FEED = params.SPEED|default(3000)|int %}

    {% set magnets = [
        [20,290],[72,290],[124,290],[176,290],[228,290],[280,290],
        [20,10],[72,10],[124,10],[176,10],[228,10],[280,10],
        [10,20],[10,72],[10,124],[10,176],[10,228],[10,280],
        [290,20],[290,72],[290,124],[290,176],[290,228],[290,280],
        [150,38],[150,113],[150,188],[150,263],
        [38,150],[113,150],[188,150],[263,150],
        [91,83],[83,209],[209,217],[217,91]
    ] %}

    {% if idx >= magnets|length %}
        M118 Tour complete! All 36 magnets visited.
        M117 Tour complete!
        SET_GCODE_VARIABLE MACRO=MAGNET_TOUR VARIABLE=index VALUE=0
    {% else %}
        {% set m = magnets[idx] %}
        {% if idx < 6 %}
            {% set label = "Back " ~ (idx + 1) %}
        {% elif idx < 12 %}
            {% set label = "Front " ~ (idx - 5) %}
        {% elif idx < 18 %}
            {% set label = "Left " ~ (idx - 11) %}
        {% elif idx < 24 %}
            {% set label = "Right " ~ (idx - 17) %}
        {% elif idx < 28 %}
            {% set label = "CenterY " ~ (idx - 23) %}
        {% elif idx < 32 %}
            {% set label = "CenterX " ~ (idx - 27) %}
        {% else %}
            {% set label = "Rotated " ~ (idx - 31) %}
        {% endif %}
        G1 Z{z} F1000
        G1 X{m[0]} Y{m[1]} F{FEED}
        M118 >>> Magnet {idx + 1}/36: {label} at ({m[0]}, {m[1]})
        M117 {idx + 1}/36 ({m[0]},{m[1]}) {label}
        SET_GCODE_VARIABLE MACRO=MAGNET_TOUR VARIABLE=index VALUE={idx + 1}
    {% endif %}

[gcode_macro MAGNET_GOTO]
description: Jump to a specific magnet number in the tour. Usage: MAGNET_GOTO N=5
gcode:
    {% set N = params.N|default(1)|int %}
    {% set z = printer["gcode_macro MAGNET_TOUR"].z_height|float %}
    {% set FEED = params.SPEED|default(3000)|int %}

    {% set magnets = [
        [20,290],[72,290],[124,290],[176,290],[228,290],[280,290],
        [20,10],[72,10],[124,10],[176,10],[228,10],[280,10],
        [10,20],[10,72],[10,124],[10,176],[10,228],[10,280],
        [290,20],[290,72],[290,124],[290,176],[290,228],[290,280],
        [150,38],[150,113],[150,188],[150,263],
        [38,150],[113,150],[188,150],[263,150],
        [91,83],[83,209],[209,217],[217,91]
    ] %}

    {% if N < 1 or N > magnets|length %}
        M118 Invalid magnet number. Use N=1 through N=36.
    {% else %}
        {% set m = magnets[N - 1] %}
        {% set idx = N - 1 %}
        {% if idx < 6 %}
            {% set label = "Back " ~ (idx + 1) %}
        {% elif idx < 12 %}
            {% set label = "Front " ~ (idx - 5) %}
        {% elif idx < 18 %}
            {% set label = "Left " ~ (idx - 11) %}
        {% elif idx < 24 %}
            {% set label = "Right " ~ (idx - 17) %}
        {% elif idx < 28 %}
            {% set label = "CenterY " ~ (idx - 23) %}
        {% elif idx < 32 %}
            {% set label = "CenterX " ~ (idx - 27) %}
        {% else %}
            {% set label = "Rotated " ~ (idx - 31) %}
        {% endif %}
        G1 Z{z} F1000
        G1 X{m[0]} Y{m[1]} F{FEED}
        M118 >>> Magnet {N}/36: {label} at ({m[0]}, {m[1]})
        M117 {N}/36 ({m[0]},{m[1]}) {label}
        SET_GCODE_VARIABLE MACRO=MAGNET_TOUR VARIABLE=index VALUE={N}
    {% endif %}

#######################################################
# MAGNET_DETECT — Binary XY sweep
# Scans at fixed Z where aluminum doesn't trigger but
# magnets do. Much faster than probing.
#
# Step 1: MAGNET_FIND_Z — finds the sweet spot Z height
# Step 2: MAGNET_DETECT — runs the full XY grid
#######################################################

[gcode_macro MAGNET_FIND_Z]
description: Find the Z height where probe triggers over magnets but not aluminum. Home with sheet, raise, remove sheet, then run this.
gcode:
    {% set START_Z = params.Z|default(1.0)|float %}
    {% set STEP = params.STEP|default(0.1)|float %}
    {% set MIN_Z = params.MIN_Z|default(-2.0)|float %}
    {% set FEED = 3000 %}

    ; Move to a known non-magnet area (center-ish, away from magnets)
    G1 X120 Y180 F{FEED}
    G1 Z{START_Z} F600

    M118 -----------------------------------------------
    M118 MAGNET_FIND_Z — finding the sweet spot
    M118 -----------------------------------------------
    M118 Lowering Z in {STEP}mm steps from {START_Z}mm.
    M118 Watch for "probe: TRIGGERED" in the console.
    M118 When it triggers, THAT Z is too low (aluminum
    M118 triggers). Use a Z slightly ABOVE that for
    M118 MAGNET_DETECT. E.g. if it triggers at Z=-0.5,
    M118 use MAGNET_DETECT Z=-0.3
    M118 -----------------------------------------------

    {% for i in range(((START_Z - MIN_Z) / STEP)|int) %}
        {% set z = START_Z - i * STEP %}
        G1 Z{z|round(2)} F300
        M118 Z={z|round(2)}
        QUERY_PROBE
        G4 P200
    {% endfor %}

    G1 Z5 F600
    M118 Done. Check console for where it first triggered.
    M117 Check console for trigger Z

[gcode_macro MAGNET_DETECT]
description: XY sweep at fixed Z, logging probe state. No homing. Usage: MAGNET_DETECT Z=-0.3 STEP=3
gcode:
    {% set Z = params.Z|default(-0.3)|float %}
    {% set STEP = params.STEP|default(3)|int %}
    {% set X_MIN = params.X_MIN|default(30)|int %}
    {% set X_MAX = params.X_MAX|default(295)|int %}
    {% set Y_MIN = params.Y_MIN|default(5)|int %}
    {% set Y_MAX = params.Y_MAX|default(265)|int %}
    {% set SPEED = params.SPEED|default(100)|int %}
    {% set FEED = SPEED * 60 %}

    {% set nx_start = X_MIN - 28 %}
    {% set nx_end = X_MAX - 28 %}
    {% set ny_start = Y_MIN + 33 %}
    {% set ny_end = Y_MAX + 33 %}

    M118 MAGNET_DETECT_START z={Z} step={STEP} area=({X_MIN},{Y_MIN})-({X_MAX},{Y_MAX})
    M118 Moving to Z={Z} — this is BELOW the sheet Z=0 reference
    G1 Z{Z} F300

    {% set y_steps = ((ny_end - ny_start) / STEP)|int %}
    {% set x_steps = ((nx_end - nx_start) / STEP)|int %}

    {% for row in range(y_steps + 1) %}
        {% set ny = ny_start + row * STEP %}
        {% set py = ny - 33 %}
        {% for col in range(x_steps + 1) %}
            {% if row % 2 == 0 %}
                {% set nx = nx_start + col * STEP %}
            {% else %}
                {% set nx = nx_end - col * STEP %}
            {% endif %}
            {% set px = nx + 28 %}
            G1 X{nx} Y{ny} F{FEED}
            G4 P50
            M118 MDET {px},{py}
            QUERY_PROBE
        {% endfor %}
    {% endfor %}

    G1 Z10 F600
    G1 X150 Y150 F3000
    M118 MAGNET_DETECT_END
    M117 Detect scan complete!

[gcode_macro MAGNET_DETECT_FINE]
description: Fine 1mm grid around a single magnet found by MAGNET_DETECT. Usage: MAGNET_DETECT_FINE X=100 Y=86 Z=-0.3 SIZE=20
gcode:
    {% set MX = params.X|default(150)|float %}
    {% set MY = params.Y|default(113)|float %}
    {% set Z = params.Z|default(-0.3)|float %}
    {% set SIZE = params.SIZE|default(20)|float %}
    {% set STEP = params.STEP|default(1)|int %}
    {% set SPEED = params.SPEED|default(80)|int %}
    {% set FEED = SPEED * 60 %}
    {% set HALF = SIZE / 2 %}

    {% set x_start = MX - HALF %}
    {% set y_start = MY - HALF %}
    {% set x_steps = (SIZE / STEP)|int %}
    {% set y_steps = (SIZE / STEP)|int %}
    {% set total = (x_steps + 1) * (y_steps + 1) %}

    M118 MAGNET_DETECT_FINE_START center=({MX},{MY}) size={SIZE} step={STEP} total={total}
    G1 Z{Z} F300

    {% for row in range(y_steps + 1) %}
        {% set py = y_start + row * STEP %}
        {% for col in range(x_steps + 1) %}
            {% if row % 2 == 0 %}
                {% set px = x_start + col * STEP %}
            {% else %}
                {% set px = x_start + (x_steps - col) * STEP %}
            {% endif %}
            {% set nx = px - 28 %}
            {% set ny = py + 33 %}
            {% set pt = row * (x_steps + 1) + col + 1 %}
            G1 X{nx} Y{ny} F{FEED}
            G4 P30
            M118 MFINE {px},{py} {pt}/{total}
            M117 Fine {pt}/{total}
            QUERY_PROBE
        {% endfor %}
    {% endfor %}

    G1 Z10 F600
    M118 MAGNET_DETECT_FINE_END
    M117 Fine scan done!