#######################################################
# Fulament Magnet Keepout Config — Artillery X1
# Created: August 2026
# Updated: August 2026 — full probe mapping complete
#
# PURPOSE:
# The Fulament Fula-Flex 2.0 bed has 36 embedded
# neodymium magnets (rectangular, ~21x10mm each) that
# hold the steel spring sheet. These magnets interfere
# with the inductive probe (AR18), causing it to
# trigger early over magnet locations. This file
# contains:
#
#   1. Faulty region definitions (commented out) —
#      SUPERSEDED. Final active regions now live in
#      fulament_magnets_active.cfg (24 probe-reachable
#      magnets) and fulament_magnets_backleft.cfg (12
#      unreachable back/left magnets, commented out).
#      Both are pulled in via [include ...] directly
#      inside [bed_mesh] in printer.cfg. See those files
#      for the final, verified faulty_region coordinates.
#      The definitions further below in THIS file are
#      the old pre-verification estimates — kept for
#      history only, do not use.
#
#   2. Macros to verify and map magnet positions using
#      the probe itself. Hardcoded probe-offset values
#      inside these macros (PROBE_GRID, PROBE_GRID_NH,
#      MAGNET_DETECT, MAGNET_DETECT_FINE) were updated
#      to match the current printer.cfg settings below.
#
# PRINTER SETUP (current, as of this update):
#   Probe: Inductive, pin ^!ar18
#   Probe offset: X=29.0, Y=-34.0  (was 28.0 / -33.0 —
#     measured directly by jogging nozzle vs probe over
#     the same physical mark, see log below)
#   [stepper_y] position_endstop: -5, position_min: -5
#     (was 0 — nozzle was off the bed at Y=0 previously)
#   Bed print area: 300x300mm (Klipper bed coordinates)
#   Physical plate size: 310x310mm (measured ~12.25in
#     square), overhangs the 300mm print area by ~5mm
#     on each side.
#   Note: position_min: -2 in [stepper_z] is needed
#   for sheet-off scanning (probe goes below Z=0)
#
#   IMPORTANT: all bed coordinates in this file and in
#   fulament_magnets_active/backleft.cfg are in the
#   CURRENT coordinate system (post endstop change).
#   If you change position_endstop on Y or the probe
#   offset again, every position here shifts and needs
#   re-deriving (see "HOW POSITIONS WERE FOUND" below).
#
# MAGNET LAYOUT (36 total) — FINAL VERIFIED POSITIONS:
#
#   Front perimeter (6): Y=8, X=[28,76,125,173,222,270]
#     Horizontal orientation. Uniform 48mm spacing,
#     anchored to fine-scanned Fr3(121,15)/Fr4(175,15)/
#     Fr6(281,15) [values shown pre Y-5 correction].
#
#   Back perimeter (6): Y=292, X=[28,76,125,173,222,270]
#     Horizontal orientation. Mirrors front spacing
#     (uniform 48mm). Outside probe reach — never
#     directly scanned, positions taken from photo
#     analysis + front/back symmetry assumption.
#
#   Left perimeter (6): X=5, Y=[22,75,128,180,233,286]
#     Vertical orientation. Uniform 53mm spacing.
#     Outside probe reach (X<28 unreachable) — never
#     directly scanned, positions taken from photo
#     analysis + left/right symmetry assumption.
#
#   Right perimeter (6): X=295, Y=[22,75,128,180,233,286]
#     Vertical orientation. Uniform 53mm spacing,
#     anchored to fine-scanned Rt1/Rt2/Rt3/Rt5.
#     Rt4 corrected from coarse (291,188) to (295,180)
#     to align X with the rest of the row and match
#     photo-derived Y spacing.
#
#   Centerline Y (4): X=150, Y=[40,104,204,268]
#     Vertical orientation. Short/long/short spacing
#     64/100/64mm (symmetric with Centerline X below).
#     CY1-CY3 fine-scanned; CY4 predicted from spacing
#     pattern (too close to back edge to reach fully).
#
#   Centerline X (4): Y=154, X=[36,100,200,264]
#     Horizontal orientation. Same 64/100/64mm pattern
#     as Centerline Y. All 4 fine-scanned. CX3 was the
#     hardest magnet to pin down — required 4 separate
#     scans across 3 different Z heights (-0.10, -0.08,
#     -0.05) because it triggers in a much narrower Z
#     window than the other magnets (weaker or seated
#     deeper). Final confirmed center: (200,154).
#
#   Rotated (4): Diagonal pairs near the 4 leveling
#     screws, confirmed via photo to be TWO ORIENTATIONS
#     (not 3 horizontal + 1 vertical as first measured):
#       Pair A (horizontal): R1(92,81), R3(208,227)
#       Pair B (vertical):   R2(76,216), R4(224,96)
#     R2 was originally mis-scanned as horizontal
#     (saturated/partial read) — corrected after a
#     clean re-scan confirmed vertical, matching the
#     diagonal symmetry seen in the reference photo.
#
# KEEPOUT BOX SIZE:
#   Horizontal magnets: 25mm wide x 14mm tall (2mm margin)
#   Vertical magnets:   14mm wide x 25mm tall (2mm margin)
#   (Superseded the original flat 8mm-radius circular
#   keepout once we confirmed magnets are rectangular,
#   not round — the probe's "bathtub" signal shape was
#   the giveaway.)
#
# HOW POSITIONS WERE FOUND:
#   1. MAGNET_DETECT coarse full-bed sweep (STEP=5)
#      found approximate locations for all reachable
#      magnets.
#   2. MAGNET_DETECT_FINE (STEP=1) around each coarse
#      hit to get an exact bathtub-shaped trigger
#      footprint; center = midpoint of the two bathtub
#      walls.
#   3. Cross-checked against a top-down photo of an
#      identical Fulament plate (from a YouTube video)
#      with slot positions extracted by image analysis
#      and rescaled from an assumed 300mm plate to the
#      confirmed 310mm physical size.
#   4. Any remaining conflicts between scan data and
#      photo were resolved by trusting fine-scanned
#      data first, then using photo-derived spacing
#      patterns (48mm front/back, 53mm left/right,
#      64/100/64mm centerlines) to fill in coarse or
#      unreachable positions symmetrically.
#######################################################

