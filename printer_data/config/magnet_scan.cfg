#######################################################
# Fulament Magnet Keepout Zones — Artillery X1
# Bed: 300x300mm, 36 magnets (coordinates are centers)
#
# Layout:
#   Perimeter: 6/side at [20,72,124,176,228,280], 10mm from bed edge
#   Centerlines: 4/axis at [38,113,188,263] on X=150 & Y=150
#   Rotated: dx=-59 dy=-67 from center, 90° symmetric
#
# Keepout radius: 8mm per magnet
#######################################################

# =====================================================
# FAULTY REGIONS — paste these into your [bed_mesh]
# section in printer.cfg AFTER verifying magnet positions.
# Also update your mesh_max to 270,265 (Y=270 is too high
# with probe Y offset -33, nozzle would hit Y=303).
# =====================================================
#
# MERGED CORNERS — each covers two nearby magnets
# Back-left corner: magnets (20,290) + (10,280)
# faulty_region_1_min: 2, 272
# faulty_region_1_max: 28, 298
# Back-right corner: magnets (280,290) + (290,280)
# faulty_region_2_min: 272, 272
# faulty_region_2_max: 298, 298
# Front-left corner: magnets (20,10) + (10,20)
# faulty_region_3_min: 2, 2
# faulty_region_3_max: 28, 28
# Front-right corner: magnets (280,10) + (290,20)
# faulty_region_4_min: 272, 2
# faulty_region_4_max: 298, 28
# Perimeter — back edge (Y=290), inner 4 only
# faulty_region_5_min: 64, 282
# faulty_region_5_max: 80, 298
# faulty_region_6_min: 116, 282
# faulty_region_6_max: 132, 298
# faulty_region_7_min: 168, 282
# faulty_region_7_max: 184, 298
# faulty_region_8_min: 220, 282
# faulty_region_8_max: 236, 298
# Perimeter — front edge (Y=10), inner 4 only
# faulty_region_9_min: 64, 2
# faulty_region_9_max: 80, 18
# faulty_region_10_min: 116, 2
# faulty_region_10_max: 132, 18
# faulty_region_11_min: 168, 2
# faulty_region_11_max: 184, 18
# faulty_region_12_min: 220, 2
# faulty_region_12_max: 236, 18
# Perimeter — left edge (X=10), inner 4 only
# faulty_region_13_min: 2, 64
# faulty_region_13_max: 18, 80
# faulty_region_14_min: 2, 116
# faulty_region_14_max: 18, 132
# faulty_region_15_min: 2, 168
# faulty_region_15_max: 18, 184
# faulty_region_16_min: 2, 220
# faulty_region_16_max: 18, 236
# Perimeter — right edge (X=290), inner 4 only
# faulty_region_17_min: 282, 64
# faulty_region_17_max: 298, 80
# faulty_region_18_min: 282, 116
# faulty_region_18_max: 298, 132
# faulty_region_19_min: 282, 168
# faulty_region_19_max: 298, 184
# faulty_region_20_min: 282, 220
# faulty_region_20_max: 298, 236
# Centerline — vertical (X=150)
# faulty_region_21_min: 142, 30
# faulty_region_21_max: 158, 46
# faulty_region_22_min: 142, 105
# faulty_region_22_max: 158, 121
# faulty_region_23_min: 142, 180
# faulty_region_23_max: 158, 196
# faulty_region_24_min: 142, 255
# faulty_region_24_max: 158, 271
# Centerline — horizontal (Y=150)
# faulty_region_25_min: 30, 142
# faulty_region_25_max: 46, 158
# faulty_region_26_min: 105, 142
# faulty_region_26_max: 121, 158
# faulty_region_27_min: 180, 142
# faulty_region_27_max: 196, 158
# faulty_region_28_min: 255, 142
# faulty_region_28_max: 271, 158
# Rotated group (dx=-59, dy=-67 from center 150,150)
# faulty_region_29_min: 83, 75
# faulty_region_29_max: 99, 91
# faulty_region_30_min: 75, 201
# faulty_region_30_max: 91, 217
# faulty_region_31_min: 201, 209
# faulty_region_31_max: 217, 225
# faulty_region_32_min: 209, 83
# faulty_region_32_max: 225, 99


#######################################################
# VERIFICATION MACROS
#######################################################
# Two ways to verify magnet locations:
#
# 1. MAGNET_SCAN — Dense 30x30 grid scan of the full bed.
#    Best run WITHOUT the steel sheet so the probe reads
#    aluminum vs neodymium directly. View the resulting
#    mesh in Mainsail/Fluidd's heightmap visualizer —
#    magnets show up as clear peaks or valleys.
#
# 2. MAGNET_VERIFY — Probes each predicted magnet center
#    plus an offset point 15mm away. Compares Z values
#    and flags any magnet where the difference is below
#    threshold (meaning we may have the wrong spot).
#    Works with or without the steel sheet.
#
# 3. MAGNET_ZOOM — Ultra-dense local scan around one magnet
#    to measure its influence radius. 20x20 grid in a small
#    box. Use to dial in the correct keepout radius.
#
# 4. PROBE_GRID — Raw probe grid. No mesh math, just moves
#    to each point, probes, and logs the XYZ to console.
#    Paste the output to Claude for plotting.
#######################################################

[gcode_macro PROBE_GRID]
description: Raw probe grid scan. Logs X,Y,Z to console. Usage: PROBE_GRID CX=150 CY=113 SIZE=40 COUNT=20
variable_running: 0
gcode:
    {% set CX = params.CX|default(150)|float %}
    {% set CY = params.CY|default(113)|float %}
    {% set SIZE = params.SIZE|default(40)|float %}
    {% set COUNT = params.COUNT|default(20)|int %}
    {% set SPEED = params.SPEED|default(80)|int %}
    {% set Z_HOP = params.Z_HOP|default(3)|float %}
    {% set Z_MIN = params.Z_MIN|default(-2)|float %}
    {% set HALF = SIZE / 2 %}
    {% set FEED = SPEED * 60 %}

    {% set x_start = CX - HALF %}
    {% set y_start = CY - HALF %}
    {% set step = SIZE / (COUNT - 1) %}

    G28
    M118 PROBE_GRID_START
    M118 center={CX},{CY} size={SIZE} count={COUNT} step={step|round(2)}
    M118 probe_offset_x=28.0 probe_offset_y=-33.0
    M118 format=PROBE_DATA,nozzle_x,nozzle_y,probe_x,probe_y,z

    {% for row in range(COUNT) %}
        {% set py = y_start + row * step %}
        {% for col in range(COUNT) %}
            {% if row % 2 == 0 %}
                {% set px = x_start + col * step %}
            {% else %}
                {% set px = x_start + (COUNT - 1 - col) * step %}
            {% endif %}
            {% set nx = px - 28.0 %}
            {% set ny = py + 33.0 %}
            G1 Z{Z_HOP} F1000
            G1 X{nx} Y{ny} F{FEED}
            PROBE SAMPLES=1
            M118 PROBE_DATA,{nx|round(2)},{ny|round(2)},{px|round(2)},{py|round(2)},{printer.probe.last_z_offset|round(4)}
        {% endfor %}
    {% endfor %}

    G1 Z10 F1000
    G1 X150 Y150 F3000
    M118 PROBE_GRID_END
    M117 Probe grid complete!

[gcode_macro MAGNET_ZOOM]
description: Dense local scan around a magnet. Usage: MAGNET_ZOOM X=150 Y=113 SIZE=40 COUNT=20
gcode:
    {% set MX = params.X|default(150)|float %}
    {% set MY = params.Y|default(113)|float %}
    {% set SIZE = params.SIZE|default(40)|float %}
    {% set COUNT = params.COUNT|default(20)|int %}
    {% set SPEED = params.SPEED|default(80)|int %}
    {% set Z_HOP = params.Z_HOP|default(5)|float %}
    {% set Z_PARK = params.Z_PARK|default(50)|float %}
    {% set HALF = SIZE / 2 %}

    {% set x_min = [(MX - HALF), 30]|max %}
    {% set x_max = [(MX + HALF), 298]|min %}
    {% set y_min = [(MY - HALF), 2]|max %}
    {% set y_max = [(MY + HALF), 265]|min %}

    G28
    G1 Z{Z_PARK} F1000
    G1 X150 Y150 F3000

    M118 -----------------------------------------------
    M118 MAGNET ZOOM — local scan around ({MX}, {MY})
    M118 Area: ({x_min},{y_min}) to ({x_max},{y_max})
    M118 Grid: {COUNT}x{COUNT} = {COUNT * COUNT} points
    M118 -----------------------------------------------
    M118 Remove steel sheet, then run MAGNET_ZOOM_GO
    M118 with same params:
    M118 MAGNET_ZOOM_GO X={MX} Y={MY} SIZE={SIZE} COUNT={COUNT}
    M118 -----------------------------------------------
    M117 Remove sheet, then MAGNET_ZOOM_GO

[gcode_macro MAGNET_ZOOM_GO]
description: Runs the local scan after sheet removal. Use same params as MAGNET_ZOOM.
gcode:
    {% set MX = params.X|default(150)|float %}
    {% set MY = params.Y|default(113)|float %}
    {% set SIZE = params.SIZE|default(40)|float %}
    {% set COUNT = params.COUNT|default(20)|int %}
    {% set SPEED = params.SPEED|default(80)|int %}
    {% set Z_HOP = params.Z_HOP|default(3)|float %}
    {% set HALF = SIZE / 2 %}

    {% set x_min = [(MX - HALF), 30]|max %}
    {% set x_max = [(MX + HALF), 298]|min %}
    {% set y_min = [(MY - HALF), 2]|max %}
    {% set y_max = [(MY + HALF), 265]|min %}

    M118 Scanning {COUNT}x{COUNT} grid around ({MX},{MY})...
    M117 Zoom scan {COUNT}x{COUNT}...

    BED_MESH_CLEAR
    BED_MESH_CALIBRATE PROFILE=magnet_zoom mesh_min={x_min},{y_min} mesh_max={x_max},{y_max} probe_count={COUNT},{COUNT} algorithm=lagrange speed={SPEED} horizontal_move_z={Z_HOP}

    G1 Z15 F600
    G1 X150 Y150 F3000
    M117 Zoom scan complete!
    M118 -----------------------------------------------
    M118 Zoom scan complete! Check heightmap.
    M118 The dip/peak shape shows the magnet influence.
    M118 -----------------------------------------------

[gcode_macro MAGNET_SCAN]
description: Dense 30x30 bed scan. Homes with steel sheet, raises Z, pauses for sheet removal.
gcode:
    {% set SPEED = params.SPEED|default(120)|int %}
    {% set Z_HOP = params.Z_HOP|default(5)|float %}
    {% set Z_PARK = params.Z_PARK|default(50)|float %}

    # Full home WITH the steel sheet in place
    G28
    # Raise Z so you can safely remove the sheet
    G1 Z{Z_PARK} F1000
    G1 X150 Y150 F3000

    M118 -----------------------------------------------
    M118 MAGNET SCAN — remove steel sheet now
    M118 -----------------------------------------------
    M118 Z is at {Z_PARK}mm. Remove the steel sheet,
    M118 then run MAGNET_SCAN_GO to start the 30x30 scan.
    M118 -----------------------------------------------
    M117 Remove sheet, then MAGNET_SCAN_GO

[gcode_macro MAGNET_SCAN_GO]
description: Call AFTER removing the steel sheet. Runs the dense 30x30 probe grid.
gcode:
    {% set SPEED = params.SPEED|default(120)|int %}
    {% set Z_HOP = params.Z_HOP|default(5)|float %}

    M118 Starting 30x30 scan (900 points)...
    M117 Scanning 30x30...

    BED_MESH_CLEAR
    BED_MESH_CALIBRATE PROFILE=magnet_scan mesh_min=30,2 mesh_max=298,265 probe_count=30,30 algorithm=bicubic speed={SPEED} horizontal_move_z={Z_HOP}

    # Park at center, raised up
    G1 Z20 F600
    G1 X150 Y150 F3000
    M117 Scan complete! Check heightmap.
    M118 -----------------------------------------------
    M118 Scan complete! Open the heightmap visualizer in
    M118 Mainsail/Fluidd to see magnet locations.
    M118 Run SAVE_CONFIG to keep the profile for later.
    M118 -----------------------------------------------

[gcode_macro MAGNET_VERIFY]
description: Homes with steel sheet, raises Z for removal, then run MAGNET_VERIFY_GO.
gcode:
    {% set Z_PARK = params.Z_PARK|default(50)|float %}

    # Full home with steel sheet, then raise Z for removal
    G28
    G1 Z{Z_PARK} F1000
    G1 X150 Y150 F3000
    M118 Z at {Z_PARK}mm. Remove steel sheet, then run MAGNET_VERIFY_GO
    M117 Remove sheet, then MAGNET_VERIFY_GO

[gcode_macro MAGNET_VERIFY_GO]
description: Call AFTER removing steel sheet. Probes each magnet vs offset point.
gcode:
    {% set Z_HOP = params.Z_HOP|default(5)|float %}
    {% set FEED = params.SPEED|default(3000)|int %}
    {% set OFFSET = params.OFFSET|default(15)|int %}
    {% set THRESHOLD = params.THRESHOLD|default(0.05)|float %}

    {% set magnets = [
        [20,290],[72,290],[124,290],[176,290],[228,290],[280,290],
        [20,10],[72,10],[124,10],[176,10],[228,10],[280,10],
        [10,20],[10,72],[10,124],[10,176],[10,228],[10,280],
        [290,20],[290,72],[290,124],[290,176],[290,228],[290,280],
        [150,38],[150,113],[150,188],[150,263],
        [38,150],[113,150],[188,150],[263,150],
        [91,83],[83,209],[209,217],[217,91]
    ] %}

    M117 Verifying {magnets|length} magnet positions...

    {% for m in magnets %}
        {% set mx = m[0] %}
        {% set my = m[1] %}
        # Clamp offset point to stay on bed
        {% set ox = [[(mx + OFFSET), 295]|min, 5]|max %}
        {% set oy = my %}
        {% if ox == mx %}
            {% set ox = [[(mx - OFFSET), 295]|min, 5]|max %}
        {% endif %}

        # Probe the magnet center
        G1 Z{Z_HOP} F1000
        G1 X{mx} Y{my} F{FEED}
        PROBE
        {% set mag_z = printer.probe.last_z_offset %}

        # Probe the offset point (should be clear of magnet)
        G1 Z{Z_HOP} F1000
        G1 X{ox} Y{oy} F{FEED}
        PROBE
        {% set ref_z = printer.probe.last_z_offset %}

        {% set diff = (mag_z - ref_z)|abs %}
        {% if diff < THRESHOLD %}
            M118 WARNING: Magnet #{loop.index} at ({mx},{my}) diff={diff|round(3)}mm — may be mislocated!
        {% else %}
            M118 OK: Magnet #{loop.index} at ({mx},{my}) diff={diff|round(3)}mm
        {% endif %}
    {% endfor %}

    G1 Z{Z_HOP} F1000
    G1 X150 Y150 F{FEED}
    M117 Verification complete! Check console output.

[gcode_macro MAGNET_TOUR]
description: Homes all axes with steel sheet, raises Z for sheet removal, then walk magnets with MAGNET_NEXT.
variable_index: 0
variable_z_height: 5
gcode:
    {% set Z = params.Z|default(5)|float %}
    {% set Z_PARK = params.Z_PARK|default(50)|float %}
    SET_GCODE_VARIABLE MACRO=MAGNET_TOUR VARIABLE=z_height VALUE={Z}
    SET_GCODE_VARIABLE MACRO=MAGNET_TOUR VARIABLE=index VALUE=0

    # Full home with steel sheet in place
    G28
    # Raise Z so you can remove the sheet
    G1 Z{Z_PARK} F1000
    G1 X150 Y150 F3000

    M118 -----------------------------------------------
    M118 MAGNET TOUR — 36 positions
    M118 -----------------------------------------------
    M118 Z is at {Z_PARK}mm. Remove the steel sheet.
    M118 Then jog Z down to just above the bare bed.
    M118 Run MAGNET_NEXT or MAGNET_GOTO N=<num>.
    M118 -----------------------------------------------
    M118 Tip: MAGNET_TOUR Z=3 to change travel height.
    M118 -----------------------------------------------

[gcode_macro MAGNET_NEXT]
description: Move to the next magnet in the tour. Shows position info.
gcode:
    {% set tour = printer["gcode_macro MAGNET_TOUR"] %}
    {% set idx = tour.index|int %}
    {% set z = tour.z_height|float %}
    {% set FEED = params.SPEED|default(3000)|int %}

    {% set magnets = [
        [20,290],[72,290],[124,290],[176,290],[228,290],[280,290],
        [20,10],[72,10],[124,10],[176,10],[228,10],[280,10],
        [10,20],[10,72],[10,124],[10,176],[10,228],[10,280],
        [290,20],[290,72],[290,124],[290,176],[290,228],[290,280],
        [150,38],[150,113],[150,188],[150,263],
        [38,150],[113,150],[188,150],[263,150],
        [91,83],[83,209],[209,217],[217,91]
    ] %}

    {% if idx >= magnets|length %}
        M118 Tour complete! All 36 magnets visited.
        M117 Tour complete!
        SET_GCODE_VARIABLE MACRO=MAGNET_TOUR VARIABLE=index VALUE=0
    {% else %}
        {% set m = magnets[idx] %}
        {% if idx < 6 %}
            {% set label = "Back " ~ (idx + 1) %}
        {% elif idx < 12 %}
            {% set label = "Front " ~ (idx - 5) %}
        {% elif idx < 18 %}
            {% set label = "Left " ~ (idx - 11) %}
        {% elif idx < 24 %}
            {% set label = "Right " ~ (idx - 17) %}
        {% elif idx < 28 %}
            {% set label = "CenterY " ~ (idx - 23) %}
        {% elif idx < 32 %}
            {% set label = "CenterX " ~ (idx - 27) %}
        {% else %}
            {% set label = "Rotated " ~ (idx - 31) %}
        {% endif %}
        G1 Z{z} F1000
        G1 X{m[0]} Y{m[1]} F{FEED}
        M118 >>> Magnet {idx + 1}/36: {label} at ({m[0]}, {m[1]})
        M117 {idx + 1}/36 ({m[0]},{m[1]}) {label}
        SET_GCODE_VARIABLE MACRO=MAGNET_TOUR VARIABLE=index VALUE={idx + 1}
    {% endif %}

[gcode_macro MAGNET_GOTO]
description: Jump to a specific magnet number in the tour. Usage: MAGNET_GOTO N=5
gcode:
    {% set N = params.N|default(1)|int %}
    {% set z = printer["gcode_macro MAGNET_TOUR"].z_height|float %}
    {% set FEED = params.SPEED|default(3000)|int %}

    {% set magnets = [
        [20,290],[72,290],[124,290],[176,290],[228,290],[280,290],
        [20,10],[72,10],[124,10],[176,10],[228,10],[280,10],
        [10,20],[10,72],[10,124],[10,176],[10,228],[10,280],
        [290,20],[290,72],[290,124],[290,176],[290,228],[290,280],
        [150,38],[150,113],[150,188],[150,263],
        [38,150],[113,150],[188,150],[263,150],
        [91,83],[83,209],[209,217],[217,91]
    ] %}

    {% if N < 1 or N > magnets|length %}
        M118 Invalid magnet number. Use N=1 through N=36.
    {% else %}
        {% set m = magnets[N - 1] %}
        {% set idx = N - 1 %}
        {% if idx < 6 %}
            {% set label = "Back " ~ (idx + 1) %}
        {% elif idx < 12 %}
            {% set label = "Front " ~ (idx - 5) %}
        {% elif idx < 18 %}
            {% set label = "Left " ~ (idx - 11) %}
        {% elif idx < 24 %}
            {% set label = "Right " ~ (idx - 17) %}
        {% elif idx < 28 %}
            {% set label = "CenterY " ~ (idx - 23) %}
        {% elif idx < 32 %}
            {% set label = "CenterX " ~ (idx - 27) %}
        {% else %}
            {% set label = "Rotated " ~ (idx - 31) %}
        {% endif %}
        G1 Z{z} F1000
        G1 X{m[0]} Y{m[1]} F{FEED}
        M118 >>> Magnet {N}/36: {label} at ({m[0]}, {m[1]})
        M117 {N}/36 ({m[0]},{m[1]}) {label}
        SET_GCODE_VARIABLE MACRO=MAGNET_TOUR VARIABLE=index VALUE={N}
    {% endif %}