[gcode_shell_command hello_world]
command: echo hello world
timeout: 2.
verbose: True
[gcode_macro HELLO_WORLD]
gcode:
    RUN_SHELL_COMMAND CMD=hello_world
[gcode_shell_command reset_wifi_command]
# This must be the actual network interface name. wlan0 is standard for RPi.
#command: /bin/sh -c "sudo ip link set dev wlan0 down; sleep 5; sudo ip link set dev wlan0 up"
command: /bin/sh -c "sudo ip link set dev wlan0 down && sleep 3 && sudo ip link set dev wlan0 up && sleep 5 && sudo systemctl restart NetworkManager"
timeout: 10.0
# Enable the output to the console for confirmation
verbose: True

[gcode_macro update_git]
gcode:
    {% set message = params.MESSAGE|default() %}
    {% if message %}
        RUN_SHELL_COMMAND CMD=update_git_script_message PARAMS="'{params.MESSAGE}'"
    {% else %}
        RUN_SHELL_COMMAND CMD=update_git_script
    {% endif %}

[gcode_shell_command update_git_script]
# Token stored in $HOME/klipper-backup/.env
command: bash -c "bash $HOME/klipper-backup/script.sh"
timeout: 90.0
verbose: True

#[gcode_shell_command update_git_script_message]  #old - Didn't work
#command: bash -c "bash $HOME/klipper-backup/script.sh -c $0"  #doesn't work with messages?
#command: bash -c "bash $HOME/klipper-backup/script.sh -c \"$*\""
#command: bash -c 'bash $HOME/klipper-backup/script.sh -c "$*"'
#timeout: 90.0
#verbose: True

[gcode_shell_command update_git_script_message] 
command: /home/pi/klipper-backup/update_git_message.sh 
timeout: 90.0 
verbose: True

